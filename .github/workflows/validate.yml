name: Validate Sub-Projects

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  validate-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Validate all Python files
        run: |
          echo "=== Validating face-detection ==="
          python -m py_compile face-detection/face-reco.py || echo "FAIL: face-detection"
          echo "=== Validating object-detection ==="
          python -m py_compile object-detection/object_detect.py || echo "FAIL: object-detection"
          echo "=== Validating pose-estimation ==="
          python -m py_compile pose-estimation/pose-estimation.py || echo "FAIL: pose-estimation"
          echo "=== Validating object-counting ==="
          python -m py_compile object-counting/object_counter.py || echo "FAIL: object-counting"
          python -m py_compile object-counting/sort.py || echo "FAIL: object-counting/sort"
          echo "=== Validating emotion-detection ==="
          python -m py_compile emotion-detection/emotion_detect.py || echo "FAIL: emotion-detection"
          echo "=== Validating face-recognition ==="
          python -m py_compile face-recognition/simple_face_recognition.py || echo "FAIL: face-recognition"
          echo "=== Done ==="

      - name: Lint all files
        run: ruff check .
